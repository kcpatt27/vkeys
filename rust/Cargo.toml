[package]
name = "vkeys"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "vkeys (virtual keys) - personal, machine-wide key store"

[[bin]]
name = "vkeys"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# preserve_order: `env` prints profile keys in TOML document order (Python tomllib).
toml = { version = "0.8", features = ["preserve_order"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
