[package]
name = "vkeys"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "vkeys (virtual keys) - personal, machine-wide key store"

[[bin]]
name = "vkeys"
path = "src/main.rs"

[dependencies]
# Text only: the default feature pulls the whole `image` stack for clipboard
# images vkeys never reads.
arboard = { version = "3", default-features = false }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
# preserve_order: vault entries keep insertion order on disk, like Python's dict.
indexmap = { version = "2", features = ["serde"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# preserve_order: `env` prints profile keys in TOML document order (Python tomllib).
toml = { version = "0.8", features = ["preserve_order"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
